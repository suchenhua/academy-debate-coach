var langdu=[
{title:'作品1号·白杨礼赞',author:'普通话水平测试朗读作品',text:'　　那是力争上游的一种树，笔直的干，笔直的枝。它的干呢，通常是丈把高，像是加以人工似的，一丈以内，绝无旁枝它所有的丫枝呢，一律向上，而且紧紧靠拢，也像是加以人工似的，成为一束，绝无横斜逸出它的宽大的叶子也是片片向上，几乎没有斜生的，更不用说倒垂了它的皮，光滑而有银色的晕圈，微微泛出淡青色。这是虽在北方的风雪的压迫下却保持着倔强挺立的一种树哪怕只有碗来粗细罢，它却努力向上发展，高到丈许，两丈，参天耸立，不折不挠，对抗着西北风。\n　　这就是白杨树，西北极普通的一种树，然而决不是平凡的树\n　　它没有婆娑的姿态，没有屈曲盘旋的虬枝，也许你要说它不美丽，如果美是专指“婆娑”或“横斜逸出”之类而言，那么白杨树算不得树中的好女子但是它却是伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔，它是树中的伟丈夫当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民难道你竟一点也不联想到，在敌后的广大土//地上，到处有坚强不屈，就像这白杨树一样傲然挺立的守卫他们家乡的哨兵难道你又不更远一点想到这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡用血写出新中国历史的那种精神和意志。\n——节选自茅盾《白杨礼赞》'},
{title:'作品2号·《差别》',author:'普通话水平测试朗读作品',text:'　　两个同龄的年轻人同时受雇于一家店铺，并且拿同样的薪水。\n　　可是一段时间后，叫阿诺德的那个小伙子青云直上，而那个叫布鲁诺的小伙子却仍在原地踏步。布鲁诺很不满意老板的不公正待遇。终于有一天他到老板那儿发牢骚了。老板一边耐心地听着他的抱怨，一边在心里盘算着怎样向他解释清楚他和阿诺德之间的差别。\n　　“布鲁诺先生，”老板开口说话了，“您现在到集市上去一下，看看今天早上有什么卖的。”\n　　布鲁诺从集市上回来向老板汇报说，今早集市上只有一个农民拉了一车土豆在卖。\n　　布鲁诺赶快戴上帽子又跑到集上，然后回来告诉老板一共四十袋土豆。\n　　布鲁诺又第三次跑到集上问来了价格。\n　　“好吧，”老板对他说，“现在请您坐到这把椅子上一句话也不要说，看看阿诺德怎么说。”\n　　阿诺德很快就从集市上回来了。向老板汇报说到现在为止只有一个农民在卖土豆，一共四十口袋，价格是多少多少土豆质量很不错，他带回来一个让老板看看。这个农民一个钟头以后还会弄来几箱西红柿，据他看价格非常公道。昨天他们铺子的西红柿卖得很快，库存已经不//多了。他想这么便宜的西红柿，老板肯定会要进一些的，所以他不仅带回了一个西红柿做样品，而且把那个农民也带来了，他现在正在外面等回话呢。\n　　此时老板转向了布鲁诺，说：“现在您肯定知道为什么阿诺德的薪水比您高了吧”\n——选自张健鹏、胡足青主编《故事时代》中《差别》'},
{title:'作品3号·《丑石》',author:'普通话水平测试朗读作品',text:'　　我常常遗憾我家门前的那块丑石：它黑黝黝地卧在那里，牛似的模样谁也不知道是什么时候留在这里的，谁也不去理会它。只是麦收时节，门前摊了麦子，奶奶总是要说：这块丑石，多碍地面呀，多时把它搬走吧。\n　　它不像汉白玉那样的细腻，可以凿下刻字雕花，也不像大青石那样的光滑，可以供来浣纱捶布它静静地卧在那里，院边的槐荫没有庇覆它，花儿也不再在它身边生长。荒草便繁衍出来，枝蔓上下，慢慢地，竟锈上了绿苔、黑斑。我们这些做孩子的，也讨厌起它来，曾合伙要搬走它，但力气又不足虽时时咒骂它，嫌弃它，也无可奈何，只好任它留在那里去了。\n　　终有一日，村子里来了一个天文学家。他在我家门前路过，突然发现了这块石头，眼光立即就拉直了。他再没有离开，就住了下来以后又来了好些人，说这是一块陨石，从天上落下来已经有二三百年了，是一件了不起的东西。不久便来了车，小心翼翼地将它运走了。\n　　这使我们都很惊奇这又怪又丑的石头，原来是天上的啊它补过天，在天上发过热，闪过光，我们的先祖或许仰望过它，它给了他们光明，向往，憧憬而它落下来了，在污土里，荒草里，一躺就//是几百年了\n　　我感到自己的无知，也感到了丑石的伟大我甚至怨恨它这么多年竟会默默地忍受着这一切而我又立即深深地感到它那种不屈于误解、寂寞的生存的伟大。\n——节选自贾平凹《丑石》'},
{title:'作品4号·达瑞的故事',author:'普通话水平测试朗读作品',text:'　　在达瑞八岁的时候，有一天他想去看电影。因为没有钱，他想是向爸妈要钱，还是自己挣钱。最后他选择了后者。他自己调制了一种汽水，向过路的行人出售。可那里正是寒冷的冬天，没有人买，只有两个人例外他的爸爸和妈妈。\n　　他偶然有一个和非常成功的商人谈话的机会。当他对商人讲述了自己的“破产史”后，商人给了他两个重要的建议：一是尝试为别人解决一个难题二是把精力集中在你知道的、你会的和你拥有的东西上。\n　　这两个建议很关键。因为对于一个八岁的孩子而言，他不会做的事情很多。于是他穿过大街小巷，不停地思考：人们会有什么难题，他又如何利用这个机会\n　　一天，吃早饭时父亲让达瑞去取报纸。美国的送报员总是把报纸从花园篱笆的一个特制的管子里塞进来。假如你想穿着睡衣舒舒服服地吃早饭和看报纸，就必须离开温暖和房间，冒着寒风，到花园去取。虽然路短，但十分麻烦。\n　　当达瑞为父亲取报纸的时候，一个主意诞生了。当天他就邻居的门铃，对他们说，每个月只需付给他一美元，他就每天早上把报纸塞到他们的房门底下。大多数人都同意了，很快他有//了七十多个顾客。一个月后，当他拿到自己赚的钱时，觉得自己简直是飞上了天。\n　　很快他又有了新的机会，他让他的顾客每天把垃圾袋放在门前，然后由他早上运到垃圾桶里，每个月加一美元。之后他还想出了许多孩子赚钱的办法，并把它集结成书，书名为《儿童挣钱的二百五十个主意》。为此，达瑞十二岁时就成了畅销书作家，十五岁有了自己的谈话节目，十七岁就拥有了几百万美元。\n——费舍尔《达瑞的故事》，刘志明译'},
{title:'作品5号·第一场雪',author:'普通话水平测试朗读作品',text:'　　这是入冬以来，胶东半岛上第一场雪。\n　　雪纷纷扬扬，下得很大。开始还伴着一阵儿小雨，不久就只见大片大片的雪花，从彤云密布的天空中飘落下来。地面上一会儿就白了。冬天的山村，到了夜里就万籁俱寂，只听得雪花簌簌地不断往下落，树木的枯枝被雪压断了，偶尔咯吱一声响。\n　　大雪整整下了一夜。今天早晨，天放晴了，太阳出来了。推开门一看，嗬好大的雪啊山川、河流、树木、房屋，全都罩上了一层厚厚的雪，万里江山，变成了粉妆玉砌的世界。落光了叶子的柳树上挂满了毛茸茸亮晶晶的银条儿而那些冬夏常青的松树和柏树上，则挂满了蓬松松沉甸甸的雪球儿。一阵风吹来，树枝轻轻地摇晃，美丽的银条儿和雪球儿簌簌地落下来，玉屑似的雪末儿随风飘扬，映着清晨的阳光，显出一道道五光十色的彩虹。\n　　大街上的积雪足有一尺多深，人踩上去，脚底下发出咯吱咯吱的响声。一群群孩子在雪地里堆雪人，掷雪球，那欢乐的叫喊声，把树枝上的雪都震落下来了。\n　　俗话说，“瑞雪兆丰年”。这个话有充分的科学根据，并不是一句迷信的成语。寒冬大雪，可以冻死一部分越冬的害虫融化了的水渗进土层深处，又能供应//庄稼生长的需要。我相信这一场十分及时的大雪，一定会促进明年春季作物，尤其是小麦的丰收。有经验的老农把雪比做是“麦子的棉被”。冬天“棉被”盖得越厚，明春麦子就长得越好，所以又有这样一句谚语：“冬天麦盖三层被，来年枕着馒头睡。”\n　　我想，这就是人们为什么把及时的大雪称为“瑞雪”的道理吧。\n——节选自峻青《第一场雪》'},
{title:'作品6号·读书人是幸福的人',author:'普通话水平测试朗读作品',text:'　　我常想读书人是世间幸福人，因为他除了拥有现实的世界之外，还拥有另一个更为浩瀚也更为丰富的世界。现实的世界是人人都有的，而后一个世界却为读书人所独有。由此我想，那些失去或不能阅读的人是多么的不幸，他们的丧失是不可补偿的。世间有诸多的不平等，财富的不平等，权力的不平等，而阅读能力的拥有或丧失却体现为精神的不平等。\n　　一个人的一生，只能经历自己拥有的那一份欣悦，那一份苦难，也许再加上他亲自闻知的那一些关于自身以外的经历和经验。然而，人们通过阅读，却能进入不同时空的诸多他人的世界。这样，具有阅读能力的人，无形间获得了超越有限生命的无限可能性。阅读不仅使他多识了草木虫鱼之名，而且可以上溯远古下及未来，饱览存在的与非存在的奇风异俗。\n　　更为重要的是，读书加惠于人们的不仅是知识的增广，而且还在于精神的感化与陶冶。人们从读书学做人，从那些往哲先贤以及当代才俊的著述中学得他们的人格。人们从《论语》中学得智慧的思考，从《史记》中学得严肃的历史精神，从《正气歌》中学得人格的刚烈，从马克思学得人世//的激情，从鲁迅学得批判精神，从托尔斯泰学得道德的执着。歌德的诗句刻写着睿智的人生，拜伦的诗句呼唤着奋斗的热情。一个读书人，一个有机会拥有超乎个人生命体验的幸运人。\n——节选自谢冕《读书人是幸福的人》'},
{title:'作品7号·二十美金的价值',author:'普通话水平测试朗读作品',text:'　　一天，爸爸下班回到家已经很晚了，他很累也有点儿烦，他发现五岁的儿子靠在门旁正等着他。\n　　“爸，我可以问您一个问题吗\n　　“什么问题“爸，您一小时可以赚多少钱”“这与你无关，你为什么问这个问题”父亲生气地说。\n　　“我只是想知道，请告诉我，您一小时赚多少钱”小孩儿哀求道。“假如你一定要知道的话，我一小时赚二十美金。”\n　　“哦，”小孩儿低下了头，接着又说，“爸，可以借我十美金吗”父亲发怒了：“如果你只是要借钱去买无意义的玩具的话，给我回到你的房间睡觉去。好好想想为什么你会那么自私。我每天辛苦工作，没时间和你玩儿小孩子的游戏。”\n　　小孩儿默默地回到自己的房间关上门。\n　　父亲坐下来还在生气。后来，他平静下来了。心想他可能对孩子太凶了或许孩子真的很想买什么东西，再说他平时很少要过钱。\n　　父亲走进孩子的房间：“你睡了吗”“爸，还没有，我还醒着。”孩子回答。\n　　“我刚才可能对你太凶了，”父亲说。“我不应该发那么大的火儿这是你要的十美金。”“爸，谢谢您。”孩子高兴地从枕头下使出一些被弄皱的钞票，慢慢地数着。\n　　“为什么你已经有钱了还要”父亲不解地问。\n　　“因为原来不够，但现在凑够了。”孩子回答：“爸我现在有//二十美金了，我可以向您买一个小时的时间吗明天请早一点儿回家我想和您一起吃晚餐。”\n——节选自唐继柳编译《二十美金的价值》'},
{title:'作品8号·巴金《繁星》',author:'普通话水平测试朗读作品',text:'　　我爱月夜，但我也爱星天。从前在家乡七八月的夜晚在庭院里纳凉的时候，我最爱看天上密密麻麻的繁星。望着星天，我就会忘记一切，仿佛回到了母亲的怀里似的。\n　　三年前在南京我住的地方有一道后门，每晚我打开后门，便看见一个静寂的夜。下面是一片菜园，上面是星群密布的蓝天。星光在我们的肉眼里虽然微小，然而它使我们光明无处不在。那时候我正在读一些天文学的书，也认得一些星星，好像它们就是我的朋友，它们常常在和我谈话一样。\n　　如今在海上，每晚和繁星相对，我把它们认得很熟了。我躺在舱面上，仰望天空。深蓝色的天空里悬着无数半明半昧的星。船在动，星也在动，它们是这样低，真是摇摇欲坠呢渐渐地我的眼睛模糊了，我好像看见无数萤火虫在我的周围飞舞。海上的夜是柔和的，是静寂的，是梦幻的。我望着许多认识的星，我仿佛看见它们在对我眨眼，我仿佛听见它们在小声说话。这时我忘记了一切。在星的怀抱中我微笑着，我沉睡着。我觉得自己是一个小孩子，现在睡在母亲的怀里了。\n　　有一夜，那个在哥伦波上船的英国人指给我看天上的巨人。他用手指着：//那四颗明亮的星是头，下面的几颗是身子，这几颗是手，那几颗是腿和脚，还有三颗星算是腰带。经他这一番指点，我果然看清楚了那个天上的巨人。看，那个巨人还在跑呢\n——节选自巴金《繁星》'},
{title:'作品9号·风筝畅想曲',author:'普通话水平测试朗读作品',text:'　　假日到河滩上转转，看见许多孩子在放风筝。一根根长长的引线，一头系在天上，一头系在地上，孩子同风筝都在天与地之间悠荡，连心也被悠荡得恍恍惚惚了，好像又回到了童年。\n　　儿时的放风筝，大多是自己的长辈或家人编扎的，几根削得很薄的篾，用细纱线扎成种种鸟兽的造型，糊上雪白的绝版，再用彩笔勾勒出面孔与翅膀的图案。通常扎得最多的是“老雕”“美人儿”“花蝴蝶”等。\n　　我们家前院就有位叔叔，擅扎风筝，远近闻名。他扎得风筝不只体形好看，色彩艳丽，放飞得高远，还在风筝上绷一叶用蒲苇削成的膜片，经风一吹，发出“嗡嗡”的声响，仿佛是风筝的歌唱，在蓝天下播扬，给开阔的天地增添了无尽的韵味，给驰荡的童心带来几分疯狂。\n　　我们那条胡同的左邻右舍的孩子们放的风筝几乎都是叔叔编扎的。他的风筝不卖钱，谁上门去要，就给谁，他乐意自己贴钱买材料。\n　　后来，这位叔叔去了海外，放风筝也渐与孩子们远离了。不过年年叔叔给家乡写信，总不忘提起儿时的放风筝。香港回归之后，他的家信中说到，他这只被故乡放飞到海外的风筝，尽管飘荡游弋，经沐风雨，可那线头儿一直在故乡和//亲人手中牵着，如今飘得太累了，也该要回归到家乡和亲人身边来了。\n　　是的。我想，不光是叔叔，我们每个人都是风筝，在妈妈手中牵着，从小放到大，再从家乡放到祖国最需要的地方去啊\n——节先自李恒瑞《风筝畅想曲》'},
{title:'作品10号·父亲的爱',author:'普通话水平测试朗读作品',text:'　　爸不懂得怎样表达爱，使我们一家人融洽相处的是我妈。他只是每天上班下班，而妈则把我们做过的错事开列清单，然后由他来责骂我们。\n　　有一次我偷了一块糖果，他要我把它送回去，告诉卖糖的说是我偷来的，说我愿意替他拆箱卸货作为赔偿。但妈妈却明白我只是个孩子。\n　　我在运动场打秋千跌断了腿，在前往医院的途中一直抱着我的，是我妈。爸把汽车停在急诊室门口，他们叫他驶开，说那空位是留给紧急车辆停放的。爸听了便叫嚷道：“你以为这是什么车旅游车”\n　　在我生日会上，爸总是显得有些不大相称。他只是忙于吹气球，布置餐桌，做杂务。把插着蜡烛的蛋糕推过来让我吹的，是我妈。\n　　我翻阅照相册时，人们总是问：“你爸爸是什么样子的”天晓得他老是忙着替别人拍照。妈和我笑容可掬地一起拍的照片，多得不可胜数。\n　　我记得妈有一次教我骑自行车。我叫他别放手，但他却说是应该放手的时候了。我摔倒之后，妈跑过来扶我，爸却挥手要她走开。我当时生气极了，决心要给他点颜色看。于是我马上爬上自行车，而且自己骑给他看。他只是微笑。\n　　我念大学时，所有的家信都是妈写的。他除//了寄支票外，还寄过一封短柬给我，说因为我没有在草坪上踢足球了，所以他的草坪长得很美。\n　　每次我打电话回家，他似乎都想跟我说话，但结果总是说：“我叫你妈来接。”\n　　我结婚时，掉眼泪的是我妈。他只是大声擤了一下鼻子，便走出房间。\n　　我从小到大都听他说：“你到哪里去什么时候回家汽车有没有汽油不，不准去。”爸完全不知道怎样表达爱。除非……\n　　会不会是他已经表达了而我却未能察觉\n——节选自美艾尔玛　邦贝克《父亲的爱》'},
{title:'作品11号·国家荣誉感',author:'普通话水平测试朗读作品',text:'　　一个大问题一直盘踞在我脑袋里：\n　　世界杯怎么会有如此巨大的吸引力除去足球本身的魅力之外，还有什么超乎其上而更伟大的东西\n　　近来观看世界杯，忽然从中得到了答案：是由于一种无上崇高的精神情感--国家荣誉感\n　　地球上的人都会有国家的概念，但未必时时都有国家的感情。往往人到异国思念家乡，心怀故国，这国家概念就变得有血有肉，爱国之情来得非常具体。而现代社会，科技昌达，信息快捷，事事上网，世界真是太小太小，国家的界限似乎也不那么清晰了。再说足球正在快速世界化，平日里各国球员频繁转会，往来随意，致使越来越多的国家联赛都具有国际的因素。球员们否认国籍，只效力于自己的俱乐部，他们比赛时的激情中完全没有爱国主义的因子。\n　　然而，到了世界杯大赛，天下大变。各国球员都回国效力，穿上与光荣的国旗同样色彩的服装。在每一场比赛前，还高唱国歌以宣誓对自己祖国的热爱与忠诚。一种血缘情感开始在全身的血管里燃烧起来，而且立刻热血沸腾。\n　　在历史时代，国家间经常发生对抗，好男儿戎装卫国。国家的荣誉往往需要以自己的生命//去换取。但在和平时代，只有这种国家之间大规模对抗性的大赛，才可以唤起那种遥远而神圣的情感，那就是：为祖国而战\n——节选自冯骥才《国家荣誉感》'},
{title:'作品12号·海滨仲夏夜',author:'普通话水平测试朗读作品',text:'　　夕阳落山不久，西方的天空，还燃烧着一片橘红色的晚霞。大海，也被这霞光染成了红色，而且比天空的景色更要壮观。因为它是活动的，每当一排排波浪涌起的时候，那映照在浪峰上的霞光，又红又亮，简直就像一片片霍霍燃烧着的火焰，闪烁着，消失了。而后面的一排，又闪烁着，滚动着，涌了过来。\n　　天空的霞光渐渐地淡下去了，深红的颜色变成了绯红，绯红又变成浅红。最后，当这一切红光都消失了的时候，那突然显得高而远了的天空，则呈现出一片肃穆的神色。最早出现的启明星，在这蓝色的天幕上闪烁起来了。它是那么大，那么亮，整个广漠的天幕上只有它在那里放射着令人注目的光辉，活象一盏悬挂在高空的明灯。\n　　夜色加浓，苍空中的“明灯”越来越多了。而城市各处的真的灯火也次第亮了起来，尤其是围绕在海港周围山坡上的那一片灯光，从半空倒映在乌蓝的海面上，随着波浪，晃动着，闪烁着，像一串流动着的珍珠，和那一片片密布在苍穹里的星斗互相辉映，煞是好看。\n　　在这幽美的夜色中，我踏着软绵绵的沙滩，沿着海边，慢慢地向前走去。海水，轻轻地抚摸着细软的沙滩，发出温柔的//刷刷声。晚来的海风，清新而又凉爽。我的心里，有着说不出的兴奋和愉快。\n　　夜风轻飘飘地吹拂着，空气中飘荡着一种大海和田禾相混合的香味，柔软的沙滩上还残留着白天太阳炙晒的余温。那些在各个工作岗位上劳动了一天的人们，三三两两地来到这软绵绵的沙滩上，他们浴着凉爽的海风，望着那缀满了星星的夜空，尽情地说笑，尽情地休憩。\n——节选自 峻青《海滨仲夏夜》'},
{title:'作品13号·海洋与生命',author:'普通话水平测试朗读作品',text:'　　生命在海洋里诞生绝不是偶然的，海洋的物理和化学性质，使它成为孕育原始生命的摇篮。\n　　我们知道，水是生物的重要组成部分，许多动物组织的含水量在百分之八十以上，而一些海洋生物的含水量高达百分之九十五。水是新陈代谢的重要媒介，没有它，体内的一系列生理和生物化学反应就无法进行，生命也就停止。因此，在短时期内动物缺水要比缺少食物更加危险。水对今天的生命是如此重要，它对脆弱的原始生命，更是举足轻重了。生命在海洋里诞生，就不会有缺水之忧。\n　　水是一种良好的溶剂。海洋中含有许多生命所必需的无机盐，如氯化钠、氯化钾、碳酸盐、磷酸盐，还有溶解氧，原始生命可以毫不费力地从中吸取它所需要的元素。\n　　水具有很高的热容量，加之海洋浩大，任凭夏季烈日曝晒，冬季寒风扫荡，它的温度变化却比较小。因此，巨大的海洋就像是天然的“温箱”。是孕育原始生命的温床。\n　　阳光虽然为生命所必需，但是阳光中的紫外线却有扼杀原始生命的危险。水能有效地吸引紫外线，因而又为原始生命提供了天然的“屏障”。\n　　这一切都是原始生命得以产生和发展的必要条件。\n——节选自童裳亮《海洋与生命》'},
{title:'作品14号·和时间赛跑',author:'普通话水平测试朗读作品',text:'　　读小学的时候，我的外祖母去世了。外祖母生前最疼爱我，我无法排除自己的忧伤，每天在学校的操场上一圈儿又一圈儿地跑着，跑得累倒在地上，扑在草坪上痛哭。\n　　那哀痛的日子，断断续续地持续了很久，爸爸妈妈也不知道如何安慰我。他们知道与其骗我说外祖母睡着了，还不如对我说实话：外祖母永远不会回来了。\n　　“什么是永远不会回来呢”我问着。\n　　“所有时间里的事物，都永远不会回来了。你的昨天过去，它就永远变成昨天，你不能再回到昨天。爸爸以前也和你一样小，现在也不能回到你这么小的童年了有一天你会长大，你会像外祖母一样老有一天你度过了你的时间，就永远不会回来了。”爸爸说。\n　　爸爸等于给我一个谜语，这谜语比课本上的“日历挂在墙壁，一天撕去一页，使我心里着急”和“一寸光阴一寸金，寸金难买寸光阴”还让我感到可怕也比作文本上的“光阴似箭，日月如梭”更让我觉得有一种说不出的滋味。\n　　时间过得那么飞快，使我的小心眼里不只是着急，还有悲伤。有一天我放学回家，看到太阳快落山了，就下决心说：“我要比太阳更快地回家。”我狂奔回去，站在庭院前喘气的时候，看到太阳//还露着半边脸，我高兴地跳跃起来，那一天我跑赢了太阳。以后我就时常做那样的游戏，有时和太阳赛跑，有时和西北风比快，有时一个暑假才能做完的作业，我十天就做完了那时我三年级，常常把哥哥五年级的作业拿来做。每一次比赛胜过时间，我就快乐得不知道怎么形容。\n　　如果将来我有什么要教给我的孩子，我会告诉他：假期你一直和时间比赛，你就可以成功\n——节选自台湾林清玄《和时间赛跑》'},
{title:'作品15号·胡适的白话电报',author:'普通话水平测试朗读作品',text:'　　三十年代初，胡适在北京大学任教授。讲课时他常常对白话文大加称赞，引起一些只喜欢文言文而不喜欢白话文的学生的不满。\n　　一次，胡适正讲得得意的时候，一位姓魏的学生突然站了起来，生气地问：“胡先生，难道说白话文就毫无缺点吗”胡适微笑着回答说：“没有。”那位学生更加激动了：“肯定有白话文废话太多，打电报用字多，花钱多。”胡适的目光顿时变亮了。轻声地解释说：“不一定吧前几天有位朋友给我打来电报，请我去政府部门工作，我决定不去，就回电拒绝了。复电是用白话写的，看来也很省字。请同学们根据我这个意思，用文言文写一个回电，看看究竟是白话文省字，还是文言文省字”胡教授刚说完，同学们立刻认真地写了起来。\n　　十五分钟过去，胡适让同学举手，报告用字的数目，然后挑了一份用字最少的文言电报稿，电文是这样写的：\n　　“才疏学浅，恐难胜任，不堪从命。”白话文的意思是：学问不深，恐怕很难担任这个工作，不能服从安排。\n　　胡适说，这份写得确实不错，仅用了十二个字。但我的白话电报却只用了五个字：\n　　胡适又解释说：“干不了”就有才疏学浅、恐难胜任的意思“谢谢”既//对朋友的介绍表示感谢，又有拒绝的意思。所以，废话多不多，并不看它是文言文还是白话文，只要注意选用字词，白话文是可以比文言文更省字的。\n——节选自陈灼主编《实用汉语中级教程》上中《胡适的白话电报》'},
{title:'作品16号·火光',author:'普通话水平测试朗读作品',text:'　　很久以前，在一个漆黑的秋天的夜晚，我泛舟在西伯利亚一条阴森森的河上。船到一个转弯处，只见前面黑黢黢的山峰下面一星火光蓦地一闪。\n　　火光又明又亮，好像就在眼前……\n　　“好啦，谢天谢地”我高兴地说，“马上就到过夜的地方啦”\n　　船夫扭头朝向后的火光望了一眼，又不以为然地划浆来。\n　　我不相信他的话，因为火光冲破朦胧的夜色，明明就在那儿闪烁。不过船夫是对的，事实上，火光的确还远着呢。\n　　这些黑夜的火光的特点是：驱散黑暗，闪闪发亮，近在眼前，令人神往。乍一看，再划几下就到了……其实却还远着呢……\n　　我们在漆黑如墨的河上又划了很久。一个个峡谷和悬崖，迎面驶来，又向后移去，仿佛消失在茫茫的远方，而火光却依然停在前头，闪闪发亮，令人神往依然是这么近，又依然是那么远 ……\n　　现在，无论是这条被悬崖峭壁的阴影笼罩的漆黑的河流，还是那一星明亮的火光，都经常浮现在我的脑际，在这以前和在这以后，曾有许多火光，似乎近在咫尺，不止使我一人心驰神往。可是生活之河却仍然在那阴森森的两岸之间流着，而火光也依旧非常遥远。因此，必须加劲划浆……\n　　然而，火光啊……毕竟……毕竟就//在前头\n——节选自俄柯罗连科《火光》，张铁夫译'},
{title:'作品17号·济南的冬天',author:'普通话水平测试朗读作品',text:'　　对于一个在北平住惯的人，像我，冬天要是不刮风，便觉得是奇迹济南的冬天是没有风声的。对于一个刚由伦敦回来的人，像我，冬天要能看得见日光，便觉得是怪事济南的冬天是响晴的。自然，在热带的地方，日光永远是那么毒，响亮的天气，反有点叫人害怕。可是，在北中国的冬天，而能有温晴的天气，济南真得算个宝地。\n　　设若单单是有阳光，那有算不了出奇。请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒，这是不是理想的境界小山整把济南围了个圈儿，只有北边缺着点口儿。这一圈小山在冬天特别可爱，好像是把济南放在一个小摇篮里，它们安静不动地低声说：“你们放心吧，这儿准保暖和。”济南的人们在冬天是面上含笑的。他们一看那些小山，心中便觉得有了着落，有了依靠。他们由天上看到山上，便不知不觉地想起：“明天也许就是春天了吧这样的温暖，今天夜里山草也许就绿起来了吧”就是这点幻想不能一时实现，他们也并不着急，因为这样慈善的冬天，干什么还希望别的呢\n　　最妙的是下点小雪呀。看吧，山上的矮松越发的青黑，//树尖上顶着一髻儿白花，好像日本看护妇。山尖全白了，给蓝天镶上一道银边。山坡上，有的地方雪厚点儿，有的地方草色还露着这样，一道儿白，一道儿暗黄，给山们穿上一件带水纹儿的花衣看着看着，这件花衣好像被风儿吹动，叫你希望看见一点更美的山的肌肤。等到快日落的时候，微黄的阳光斜射在山腰上，那点薄雪好像忽然害羞，微微露出点粉色。就是下小雪吧，济南是受不住大雪的，那些小山太秀气。\n——节选自老舍《济南的冬天》'},
{title:'作品18号·家乡的桥',author:'普通话水平测试朗读作品',text:'　　纯朴的家乡村边有一条河，曲曲弯弯，河中架一弯石桥，弓样的小桥跨两岸。\n　　每天，不管是鸡鸣晓月，日丽中天，还是月华泻地，小桥都印下串串足迹，洒落串串汗珠。那是乡亲为了追求多棱的希望，兑现美好的遐想。弯弯小桥，不时荡过轻吟低唱，不时露出舒心的笑容。\n　　因而，我稚小的心灵，曾将心声献给小桥：你是一弯银色的新月，给人间普照光辉你是一把闪亮的镰刀，割刈着欢笑的花果你是一根晃悠悠的扁担，挑起了彩色的明天哦，小桥走进我的梦中。\n　　我在飘泊他乡的岁月，心中总涌动着故乡的河水，梦中总看到弓样的小桥。当我访南疆探北国，眼帘闯进座座雄伟的长桥时，我的梦变得丰满了，增添了赤橙黄绿青蓝紫。\n　　三十多年过去，我带着满头霜花回到故乡，第一紧要的便是去看望小桥。\n　　啊小桥呢它躲起来了河中一道长虹，浴着朝霞熠熠闪光。哦，雄浑的大桥敞开胸怀，汽车的呼啸、摩托的笛音、自行车的叮铃，合奏着进行交响乐南来的钢筋、花布，北往的柑橙、家禽，绘出交流欢跃图……\n　　啊蜕变的桥，传递了家乡进步的消息，透露了家乡富裕的声音。时代的春风，美好的追求，我蓦地记起儿时唱//给小桥的歌，哦，明艳艳的太阳照耀了，芳香甜蜜的花果捧来了，五彩斑斓的岁月拉开了\n　　我心中涌动的河水，激荡起甜美的浪花。我仰望一碧蓝天，心底轻声呼喊：家乡的桥啊，我梦中的桥\n——节选自郑莹《家乡的桥》'},
{title:'作品19号·坚守你的高贵',author:'普通话水平测试朗读作品',text:'　　三百多年前，建筑设计师莱伊恩受命设计了英国温泽市政府大厅。他运用工程力学的知识，依据自己多年的实践，巧妙地设计了只用一根柱子支撑的大厅天花板。一年以后，市政府人士进行工程验收时，却说只用一根柱子支撑天花板太危险，要求莱伊恩再多加几根柱子。\n　　莱伊恩自信只要一根坚固的柱子足以保证大厅安全，他的“固执”惹恼了市政官员，险些被送上法庭。他非常苦恼，坚持自己原先的主张吧，市政官员肯定会另找人修改设计不坚持吧，又有悖自己为人的准则，矛盾了很长一段时间，莱伊恩终于想出了一条妙计，他在大厅里增加了四根柱子，不过这些柱子并未与天花板接触，只不过是装装样子。\n　　三百多年过去了，这个秘密始终没有被人发现。直到前两年，市政府准备修缮大厅的天花板，才发现莱伊恩看看的“弄虚作假”。消息传出后，世界各国的建筑专家和游客云集，当地政府对此也不加掩饰，在新世纪到来之际，特意将大厅作为一个旅游景点对外开放，旨在引导人们崇尚和相信科学。\n　　作为一名建筑师，莱伊恩并不是最出色的。但作为一个人，他无疑非常伟大，这种//伟大表现在他始终恪守着自己的原则，给高贵的心灵一个美丽的住所：哪怕是遭到最大的阻力，也要想办法抵达胜利。\n——节选自游宇明《坚守你的高贵》'},
{title:'作品20号·《金子》',author:'普通话水平测试朗读作品',text:'　　自从传言有人在萨文河畔散步时无意发现了金子后，这里便常有来自四面八方的掏金者。他们都想成为富翁，于是寻遍了整个河床，还在河床上挖出很多大坑，希望借助它们找到更多的金子。的确，有一些人找到了，但另外一些人因为一无所得而只好扫兴归去。\n　　也有不甘心落后的，便驻扎在这里，继续寻找。彼得弗雷特就是其中一员。他在河床附近买了一块没人要的土地，一个人默默地工作。他为了找金子，已把所有的钱都押在这块土地上。他埋头苦干了几个月，直到土地全变成了坑坑洼洼，他失望了——他翻遍了整块土地，但连一丁点儿金子都没看见。\n　　六个月后，他连买面包的钱都没有了。于是他准备离开这儿到别处去谋生。\n　　就在他即将离去的前一个晚上，天下起了倾盆大雨，并且一下就是三天三夜。雨终于停了，彼得走出小木屋，发现眼前的土地看上去好像和以前不一样：坑坑洼洼已被大水冲刷平整，松软的土地上长出一层绿茸茸的小草。\n　　“这里没找到金子，”彼得忽有所悟地说，“但这土地很肥沃，我可以用来种花，并且拿到镇上去卖给那些富人，他们一定会买些花装扮他们华丽的客//厅。如果真是这样的话，那么我一定会赚许多钱。有朝一日我也会成为富人……”\n　　于是他留了下来。彼得花了不少精力培育花苗，不久田地里长满了美丽娇艳的各色鲜花。\n　　五年以后，彼得终于实现了他的梦想——成了一个富翁。“我是唯一的一个找到真金的人”他时常不无骄傲地告诉别人，“别人在这儿找不到金子后便远远地离开，而我的‘金子’是在这块土地里，只有诚实的人用勤劳才能采集到。”\n——节选自陶猛译《金子》'},
{title:'作品22号·可爱的小鸟',author:'普通话水平测试朗读作品',text:'　　没有一片绿叶，没有一缕炊烟，没有一粒泥土，没有一丝花香，只有水的世界，云的海洋。\n　　一阵台风袭过，一只孤单的小鸟无家可归，落到被卷到洋里的木板上，乘流而下，姗姗而来，近了，近了……\n　　忽然，小鸟张开翅膀，在人们头顶盘旋了几圈，“噗啦” 一声落到了船上。许是累了还是发现了“新大陆”水手撵它它不走，抓它，它乖乖地落在掌心。可爱的小鸟和善良的水手结成了朋友。\n　　瞧，它多美丽，娇巧的小嘴，啄理着绿色的羽毛，鸭子样的扁脚，呈现出春草的鹅黄。水手们把它带到舱里，给它“搭铺”，让它在船上安家落户，每天，把分到的一塑料桶淡水匀给它喝，把从祖国带来的鲜美的鱼肉分给它吃，天长日久，小鸟和水手的感情日趋笃厚。清晨，当第一束阳光射进舷窗时，它便敞开美丽的歌喉，唱啊唱，嘤嘤有韵，婉如春水淙淙。人类给它以生命，它毫不悭吝地把自己的艺术青春奉献给了哺育它的人。可能都是这样艺术家们的青春只会献给尊敬他们的人。\n　　小鸟给远航生活蒙上了一层浪漫色调，返航时，人们爱不释手，恋恋不舍地想把它带到异乡。可小鸟憔悴了，给水，不喝喂肉，不吃油亮的羽毛失去了光泽。是啊，我//们有自己的祖国，小鸟也有它的归宿，人和动物都是一样啊，哪儿也不如故乡好\n　　慈爱的水手们决定放开它，让它回到大海的摇篮去，回到蓝色的故乡去。离别前，这个大自然的朋友与水手们留影纪念。它站在许多人的头上，肩上，掌上，胳膊上，与喂养过它的人们，一起融进那蓝色的画面……\n——节选自王文杰《可爱的小鸟》'},
{title:'作品23号·课不能停',author:'普通话水平测试朗读作品',text:'　　纽约的冬天常有大风雪，扑面的雪花不但令人难以睁开眼睛，甚至呼吸都会吸入冰冷的雪花。有时前一天晚上还是一片晴朗，第二天拉开窗帘，却已经积雪盈尺，连门都推不开了。\n　　遇到这样的情况，公司、商店常会停止上班，学校也通过广播，宣布停课。但令人不解的是，惟有公立小学，仍然开放。只见黄色的校车，艰难地在路边接孩子，老师则一大早就口中喷着热气，铲去车子前后的积雪，小心翼翼地开车去学校。\n　　据统计，十年来纽约的公立小学只因为超级暴风雪停过七次课。这是多么令人惊讶的事。犯得着在大人都无须上班的时候让孩子去学校吗小学的老师也太倒霉了吧\n　　于是，每逢大雪而小学不停课时，都有家长打电话去骂。妙的是，每个打电话的人，反应全一样先是怒气冲冲地责问，然后满口道歉，最后笑容满面地挂上电话。原因是，学校告诉家长：\n　　在纽约有许多百万富翁，但也有不少贫困的家庭。后者白天开不起暖气，供不起午餐，孩子的营养全靠学校里免费的中饭，甚至可以多拿些回家当晚餐。学校停课一天，穷孩子就受一天冻，挨一天饿，所以老师们宁愿自己苦一点儿，也不能停课。\n　　或许有家长会说：何不让富裕的孩子在家里，让贫穷的孩子去学校享受暖气和营养午餐呢\n　　学校的答复是：我们不愿让那些穷苦的孩子感到他们是在接受救济，因为施舍的较高原则是保持受施者的尊严。\n——节选自台湾刘墉《课不能停》'},
