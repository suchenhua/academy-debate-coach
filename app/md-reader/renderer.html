<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Academy MD 阅读</title>
<link rel="stylesheet" href="reader.css" />
</head>
<body>
  <header class="topbar">
    <button id="pin" class="tbtn" title="窗口常置顶（钉住）">📌</button>
    <span class="grow file" id="fileName" title="">未命名</span>
    <span class="toolgroup">
      <button id="dec" class="tbtn" title="减小字号">A−</button>
      <span id="sizeVal">16</span>
      <button id="inc" class="tbtn" title="增大字号">A＋</button>
      <span class="csep"></span>
      <button id="theme" class="tbtn" title="浅色 / 深色 / 跟随系统">🌓</button>
      <button id="copy" class="tbtn" title="复制全文">📋 复制</button>
      <button id="word" class="tbtn" title="导出为 Word 文档">⬇ 存 Word</button>
      <span class="csep"></span>
      <button id="edit" class="tbtn" title="编辑这个文件（Ctrl+E）">✏️ 编辑</button>
      <button id="save" class="tbtn save hidden" title="保存到原文件（Ctrl+S）">💾 保存</button>
    </span>
    <button id="academy" class="academy" title="把这个文件交给 Academy 完整版继续处理">🎓 在 Academy 接着做</button>
  </header>
  <div class="meta" id="meta"></div>
  <article class="md" id="content"><p class="hint">正在打开…</p></article>
  <div class="editor hidden" id="editorWrap">
    <textarea id="editor" spellcheck="false" placeholder="在这里编辑 Markdown 原文…"></textarea>
  </div>

  <div id="toast" class="toast">…</div>
  <script src="md-view.js"></script>
  <script src="reader.js"></script>
<script src="../public/locale.js"></script>
<script>
/* 语言引导：主进程按「--lang > data/config.json」解析出语言后经 ?lang= 透传
   （file:// 与主窗口不同源，localStorage 不通）；直接以 http 打开时退回同源 localStorage。
   q 优先并写回 localStorage，让 locale.js 的 academyLocale 与英文观察器都取到对的值。 */
(function () {
  var q = '';
  try { q = new URLSearchParams(location.search).get('lang') || ''; } catch (_) {}
  var loc = q || (function () { try { return localStorage.getItem('academy.locale.v1') || ''; } catch (_) { return ''; } })();
  if (q === 'en' || q === 'zh-TW' || q === 'zh-CN') { try { localStorage.setItem('academy.locale.v1', q); } catch (_) {} }
  if (loc === 'en' && typeof applyEnglishUI === 'function') {
    applyEnglishUI();
    if (typeof armEnglishWatcher === 'function') armEnglishWatcher();
  } else if (loc === 'zh-TW' && typeof applyLocaleToStatic === 'function') {
    try { document.documentElement.lang = 'zh-TW'; } catch (_) {}
    applyLocaleToStatic();
    [200, 600, 1200].forEach(function (ms) { setTimeout(function () { try { applyLocaleToStatic(); } catch (_) {} }, ms); });
  }
})();
</script>
</body>
</html>
