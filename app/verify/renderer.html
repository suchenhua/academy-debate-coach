<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🛡 证据检证 · Academy 辩论教练</title>
<link rel="stylesheet" href="../tool.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">🛡 证据检证</span>
    <span class="grow"></span>
    <span id="connState" class="conn">连接中…</span>
  </header>

  <div id="boot" class="boot"><p class="hint">正在连接主 App…</p></div>

  <main id="app" class="hidden">
    <div id="workPanel" class="work-panel">
      <div class="panel-title">🛡 证据检证</div>
      <p class="panel-hint">把准备上场的论据贴进来（数据 / 案例 / 研究结论 / 名人引言）。会<b>真联网</b>查原始出处，核对是否被编造、曲解、断章取义。检证的是「这条论据是真的吗」；想追「这段资料最早从哪来」，用旁边的 📚 资料溯源。</p>
      <div class="depth-row">
        <button type="button" class="depth-chip active" data-depth="quick" title="单轮检索直接判定，赛场上用">⚡ 快速检证（约 20~40 秒）</button>
        <button type="button" class="depth-chip" data-depth="deep" title="内核多轮检索+交叉验证，赛后复核用">🛡 完整检证（1~5 分钟）</button>
        <button type="button" class="btn ghost cross-link" id="btnGoTrace" title="这段资料最早从哪来？用资料溯源">📚 资料溯源</button>
      </div>
      <textarea id="workInput" rows="8" placeholder="贴一条论据，如：据《柳叶刀》2019 年研究，中国有 9500 万抑郁症患者。（快速检证一次只查一条，任何服务商都能用）"></textarea>
      <div class="panel-actions">
        <button type="button" class="btn primary" id="btnRun">开始检证</button>
      </div>
      <div id="workResult" class="panel-result hidden"></div>
    </div>
  </main>

  <div id="toast" class="toast">…</div>
  <script src="../research/md-view.js"></script>
  <script src="verify.js"></script>
</body>
</html>
