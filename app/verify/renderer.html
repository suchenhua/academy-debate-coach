<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>证据检证 · Academy 辩论教练</title>
<link rel="stylesheet" href="../public/tokens.css" />
<link rel="stylesheet" href="../tool.css" />
<script src="../public/icons.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="logo"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-shield"></use></svg>证据检证</span>
    <span class="grow"></span>
    <span id="connState" class="conn">连接中…</span>
  </header>

  <div id="boot" class="boot"><p class="hint">正在连接主 App…</p></div>

  <main id="app" class="hidden">
    <div id="workPanel" class="work-panel">
      <div class="panel-title"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-shield"></use></svg>证据检证</div>
      <p class="panel-hint">把准备上场的论据贴进来（数据 / 案例 / 研究结论 / 名人引言）。会<b>真联网</b>查原始出处，核对是否被编造、曲解、断章取义。检证的是「这条论据是真的吗」；想追「这段资料最早从哪来」，用旁边的资料溯源。</p>
      <div class="depth-row">
        <button type="button" class="depth-chip active" data-depth="quick" title="单轮检索直接判定，赛场上用"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-bolt"></use></svg>快速检证（约 20~40 秒）</button>
        <button type="button" class="depth-chip" data-depth="deep" title="内核多轮检索+交叉验证，赛后复核用"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-shield"></use></svg>完整检证（1~5 分钟）</button>
        <button type="button" class="btn ghost cross-link" id="btnGoTrace" title="资料溯源"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-library"></use></svg>资料溯源</button>
      </div>
      <textarea id="workInput" rows="8" placeholder="贴一条论据，如：据《柳叶刀》2019 年研究，中国有 9500 万抑郁症患者。（快速检证一次只查一条，任何服务商都能用）"></textarea>
      <div class="panel-actions">
        <button type="button" class="btn primary" id="btnRun"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"></use></svg>开始检证</button>
      </div>
      <div id="workResult" class="panel-result hidden"></div>
    </div>
  </main>

  <div id="toast" class="toast">…</div>
  <script src="../research/md-view.js"></script>
  <script src="verify.js"></script>
<script src="../public/locale.js"></script>
<script>
/* 英文模式引导：工具窗由主窗口 spawn 时传 ?lang=en（file:// 与主窗口不同源，localStorage 不通）；
   直接以 http 打开时退回读同源 localStorage。 */
(function () {
  var q = '';
  try { q = new URLSearchParams(location.search).get('lang') || ''; } catch (_) {}
  var en = q === 'en' || (!q && (localStorage.getItem('academy.locale.v1') || '') === 'en');
  if (en && typeof applyEnglishUI === 'function') {
    applyEnglishUI();
    if (typeof armEnglishWatcher === 'function') armEnglishWatcher();
  }
})();
</script>
</body>
</html>
